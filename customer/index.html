<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#090909"
    >

    <title>Noakhali Bike</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        crossorigin=""
    >
</head>

<body>

    <!-- =====================================
         APP HEADER
    ====================================== -->

    <header class="app-header">

        <div class="brand">
            <div class="brand-mark">NB</div>

            <div>
                <strong>Noakhali Bike</strong>
                <span>Ride locally. Ride better.</span>
            </div>
        </div>

        <button
            class="location-button"
            id="locateMe"
            type="button"
            aria-label="Locate me"
        >
            ◎
        </button>

    </header>


    <!-- =====================================
         MAP
    ====================================== -->

    <main>

        <section class="map-section">

            <div
                id="map"
                class="map"
            ></div>

            <div class="map-status">
                <span class="status-dot"></span>
                <span id="mapStatus">
                    Locating you...
                </span>
            </div>

        </section>


        <!-- =================================
             BOOKING PANEL
        ================================== -->

        <section class="booking-panel">

            <div class="booking-handle"></div>


            <div class="booking-heading">

                <div>
                    <span class="eyebrow">
                        BOOK A RIDE
                    </span>

                    <h1>
                        Where are you going?
                    </h1>
                </div>

                <div class="live-badge">
                    LIVE
                </div>

            </div>


            <!-- PICKUP -->

            <div class="route-box">

                <div class="route-line">

                    <div class="route-dot pickup-dot"></div>

                    <div class="route-copy">

                        <span>
                            PICKUP
                        </span>

                        <strong id="pickupLocation">
                            Detecting your location...
                        </strong>

                    </div>

                </div>


                <div class="route-connector"></div>


                <!-- DESTINATION -->

                <div class="route-line">

                    <div class="route-dot destination-dot"></div>

                    <div class="route-copy">

                        <span>
                            DESTINATION
                        </span>

                        <input
                            id="destination"
                            type="text"
                            autocomplete="off"
                            placeholder="Where to?"
                        >

                    </div>

                </div>

            </div>


            <!-- FIND RIDE -->

            <button
                id="findRide"
                class="primary-button"
                type="button"
            >
                <span>FIND A RIDE</span>
                <span>→</span>
            </button>


            <!-- =================================
                 RIDE OPTIONS
            ================================== -->

            <section class="ride-section">

                <div class="section-title">

                    <div>
                        <span class="eyebrow">
                            RIDE OPTIONS
                        </span>

                        <h2>
                            Choose your ride
                        </h2>
                    </div>

                    <span>
                        Available nearby
                    </span>

                </div>


                <!-- NOAKHALI BIKE -->

                <button
                    class="ride-card selected"
                    id="bikeRideCard"
                    type="button"
                >

                    <div class="ride-icon">
                        🏍️
                    </div>

                    <div class="ride-info">

                        <strong>
                            Noakhali Bike
                        </strong>

                        <span>
                            Fast & affordable
                        </span>

                    </div>

                    <div class="ride-price">

                        <strong id="bikeFareDisplay">
                            ৳ --
                        </strong>

                        <span>
                            Estimated
                        </span>

                    </div>

                </button>


                <!-- PREMIUM -->

                <button
                    class="ride-card"
                    id="premiumRideCard"
                    type="button"
                >

                    <div class="ride-icon premium-icon">
                        🏍️
                    </div>

                    <div class="ride-info">

                        <strong>
                            Bike Premium
                        </strong>

                        <span>
                            Comfort ride
                        </span>

                    </div>

                    <div class="ride-price">

                        <strong id="premiumFareDisplay">
                            ৳ --
                        </strong>

                        <span>
                            Estimated
                        </span>

                    </div>

                </button>

            </section>


            <!-- =================================
                 TRIP ESTIMATE
            ================================== -->

            <div id="fareResult"></div>


            <!-- =================================
                 BOTTOM NAV
            ================================== -->

            <nav class="bottom-nav">

                <button
                    class="nav-item active"
                    type="button"
                >
                    <span>⌂</span>
                    <small>Home</small>
                </button>

                <button
                    class="nav-item"
                    type="button"
                >
                    <span>◷</span>
                    <small>Rides</small>
                </button>

                <button
                    class="nav-item"
                    type="button"
                >
                    <span>▣</span>
                    <small>Payments</small>
                </button>

                <button
                    class="nav-item"
                    type="button"
                >
                    <span>◉</span>
                    <small>Profile</small>
                </button>

            </nav>

        </section>

    </main>


    <!-- LEAFLET -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        crossorigin=""
    ></script>

    <script src="app.js"></script>

</body>
</html>
